<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-no-redirect>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark light">
    <title>Ledger — ключи</title>
    <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/shared/fonts.css">
    <link rel="stylesheet" href="/shared/style.css">
    <link rel="stylesheet" href="/admin.css">
    <script src="/shared/ui.js"></script>
</head>
<body>
    <div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

    <!-- sign in -->
    <main id="signin" class="ad-signin hidden">
        <form id="signin-form" class="gate-card ad-card" autocomplete="off">
            <div class="ad-brand">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="9"/><path d="M8 21h16"/><circle cx="11" cy="21" r="2.6" class="m-r"/><circle cx="17.5" cy="21" r="2.6" class="m-d"/><path d="M11 11v6M17.5 8v9M24 14v3"/></svg>
                <span>Ledger · ключи</span>
            </div>
            <h1>Вход для владельца</h1>
            <label for="pw">Пароль администратора</label>
            <input id="pw" type="password" autocomplete="current-password" required>
            <p id="signin-err" class="inline-error"></p>
            <button class="btn primary-btn large-btn" type="submit">Войти</button>
        </form>
    </main>

    <!-- dashboard -->
    <div id="app" class="app-container hidden">
        <header class="main-header ad-header">
            <a class="brand" href="/admin/">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="9"/><path d="M8 21h16"/><circle cx="11" cy="21" r="2.6" class="m-r"/><circle cx="17.5" cy="21" r="2.6" class="m-d"/><path d="M11 11v6M17.5 8v9M24 14v3"/></svg>
                <span class="brand-name">Ledger · ключи</span>
            </a>
            <div></div>
            <div class="header-actions">
                <button id="theme" class="btn icon-btn" type="button" title="Тема" aria-label="Тема"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button>
                <button id="refresh" class="btn icon-btn" type="button" title="Обновить" aria-label="Обновить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></button>
                <button id="logout" class="btn small-btn" type="button">Выйти</button>
            </div>
        </header>

        <section class="ad-stats" id="stats"></section>

        <div class="ad-grid">
            <section class="card ad-issue">
                <div class="card-header"><h2>Выдать ключ</h2></div>
                <form class="card-body" id="issue" autocomplete="off">
                    <div class="input-group">
                        <label for="i-label">Для кого</label>
                        <input id="i-label" type="text" maxlength="60" placeholder="Например, Вася" required>
                    </div>
                    <div class="input-group">
                        <label for="i-note">Заметка</label>
                        <input id="i-note" type="text" maxlength="200" placeholder="Telegram покупателя, сумма, что угодно">
                    </div>
                    <div class="input-group">
                        <label>Срок</label>
                        <div class="seg" id="i-days" role="radiogroup">
                            <button type="button" data-v="1">1 день</button>
                            <button type="button" data-v="7">7 дней</button>
                            <button type="button" data-v="30" class="on">30 дней</button>
                            <button type="button" data-v="90">90 дней</button>
                            <button type="button" data-v="365">Год</button>
                            <button type="button" data-v="0">Навсегда</button>
                        </div>
                        <small>Отсчёт идёт с первого входа, а не с момента выдачи.</small>
                    </div>
                    <div class="row-group">
                        <div class="input-group grow">
                            <label for="i-devices">Компьютеров</label>
                            <select id="i-devices"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select>
                        </div>
                        <div class="input-group grow">
                            <label for="i-count">Сколько ключей</label>
                            <input id="i-count" type="number" min="1" max="50" value="1">
                        </div>
                    </div>
                    <button class="btn primary-btn large-btn" type="submit">Создать ключ</button>
                </form>
            </section>

            <section class="card ad-keys">
                <div class="card-header">
                    <h2>Ключи</h2>
                    <div class="ad-tools">
                        <div class="seg small" id="filter">
                            <button type="button" data-f="all" class="on">Все</button>
                            <button type="button" data-f="active">Активные</button>
                            <button type="button" data-f="unused">Не выданы</button>
                            <button type="button" data-f="expired">Истекли</button>
                            <button type="button" data-f="revoked">Отозваны</button>
                        </div>
                        <input id="search" type="text" placeholder="Поиск по имени, заметке, концу ключа">
                    </div>
                </div>
                <div class="card-body">
                    <div id="keys" class="ad-list"></div>
                </div>
            </section>
        </div>

        <section class="card ad-events">
            <div class="card-header"><h2>Активность</h2><span class="hint">последние события</span></div>
            <div class="card-body"><div id="events" class="ad-feed"></div></div>
        </section>
    </div>

    <script src="/admin.js"></script>
</body>
</html>
