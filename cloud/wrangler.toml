# Ledger key server (Cloudflare Workers + D1). Free plan is enough.
# deploy.bat fills in database_id for you on the first run.
name = "ledger-keys"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[build]
command = "node build.js"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

[[d1_databases]]
binding = "DB"
database_name = "ledger-keys"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# shown on the login screen of every Ledger: "No key? Buy one in Telegram"
TELEGRAM = "m4ks1em"
GITHUB = "https://github.com/m4ks1em-maker/ledger"

# ADMIN_PASSWORD is a secret, never put it here:
#   npx wrangler secret put ADMIN_PASSWORD
