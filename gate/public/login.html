<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="dark light">
    <title>Ledger — Sign in</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/fonts.css?v=20">
    <link rel="stylesheet" href="/style.css?v=20">
    <link rel="stylesheet" href="/gate/gate.css?v=20">
    <script src="/i18n.js?v=20"></script>
    <script src="/ui.js?v=20"></script>
</head>
<body class="gate">
    <div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
    <div class="gate-top"></div>

    <main class="gate-shell">
        <div class="gate-stack">
            <div class="gate-brand">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="9"/><path d="M8 21h16"/><circle cx="11" cy="21" r="2.6" class="m-r"/><circle cx="17.5" cy="21" r="2.6" class="m-d"/><path d="M11 11v6M17.5 8v9M24 14v3"/></svg>
                <span>Ledger</span>
            </div>
            <h1 class="gate-title">Sign in with your key</h1>
            <p class="gate-sub">Enter the key you bought to unlock Ledger on this computer.</p>

            <form id="form" class="gate-card" autocomplete="off" novalidate>
                <label for="key">Access key</label>
                <div class="field">
                    <input id="key" name="key" type="text" placeholder="LDG-XXXX-XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="characters" autocorrect="off" autocomplete="off" maxlength="40" required>
                    <button type="button" id="paste" class="paste">Paste</button>
                </div>
                <div class="key-dots" id="dots" aria-hidden="true"></div>
                <div id="error" class="gate-error" role="alert" aria-live="polite"></div>
                <button id="submit" class="btn primary-btn large-btn" type="submit" disabled>Enter</button>
            </form>

            <a class="buy" id="buy" href="https://t.me/m4ks1em" target="_blank" rel="noopener noreferrer">
                <span class="buy-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 4.2 2.9 11.3c-.9.4-.9 1.6.1 1.9l4.6 1.5 1.8 5.6c.3.8 1.3 1 1.9.4l2.6-2.5 4.9 3.6c.7.5 1.6.1 1.8-.7l3.2-15.2c.2-1-.8-1.8-1.7-1.5z"/><path d="m7.8 14.6 10-7.2"/></svg></span>
                <span class="buy-text"><b>No key yet?</b><span>Buy one in Telegram</span></span>
                <span class="buy-handle" id="buy-handle">@m4ks1em</span>
            </a>

            <p class="gate-foot">Works on one computer per key. Keys are checked online, then Ledger keeps working offline for up to 3 days.</p>
        </div>
    </main>
    <script src="/gate/login.js?v=20"></script>
</body>
</html>
